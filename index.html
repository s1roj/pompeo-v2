<!doctype html>

            </div>
          </div>
          <div class="card">
            <div>

          </div>
          <div class="card">

              <p>Dark Bowl</p>
              <p class="price">$ 115.00 USD</p>
            </div>
          </div>
          <div class="card">
            <div>
              <img src="./images/card-6.png" alt="" />
            </div>
            <div>
              <p>Square Pottery</p>
              <p class="price">$ 75.00 USD</p>
            </div>
          </div>

        <div class="cards-btn">

      </section>
    </main>

</html>
